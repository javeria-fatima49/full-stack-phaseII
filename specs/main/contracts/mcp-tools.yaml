mcp_version: "1.0"
tools:
  - name: add_task
    description: Create a new task for the user
    parameters:
      - name: user_id
        type: integer
        required: true
        description: ID of the user creating the task
      - name: title
        type: string
        required: true
        description: Title of the task
        min_length: 1
        max_length: 255
      - name: description
        type: string
        required: false
        description: Optional detailed description of the task
        max_length: 10000
    returns:
      type: object
      properties:
        task_id:
          type: integer
          description: ID of the created task
        status:
          type: string
          enum: [pending, completed]
          description: Initial status of the task (always 'pending')
        title:
          type: string
          description: Title of the created task
    examples:
      - parameters:
          user_id: 123
          title: "Buy groceries"
        result:
          task_id: 456
          status: "pending"
          title: "Buy groceries"
      - parameters:
          user_id: 123
          title: "Call mom"
          description: "Discuss weekend plans"
        result:
          task_id: 457
          status: "pending"
          title: "Call mom"

  - name: list_tasks
    description: Retrieve tasks for the user
    parameters:
      - name: user_id
        type: integer
        required: true
        description: ID of the user whose tasks to retrieve
      - name: status
        type: string
        required: false
        description: Filter tasks by status
        enum: [all, pending, completed]
        default: "all"
    returns:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            description: Task ID
          title:
            type: string
            description: Task title
          description:
            type: string
            nullable: true
            description: Task description (if provided)
          completed:
            type: boolean
            description: Completion status
          created_at:
            type: string
            format: date-time
            description: Creation timestamp
          updated_at:
            type: string
            format: date-time
            description: Last update timestamp
    examples:
      - parameters:
          user_id: 123
          status: "all"
        result:
          - id: 1
            title: "Buy groceries"
            description: null
            completed: false
            created_at: "2026-01-16T10:00:00Z"
            updated_at: "2026-01-16T10:00:00Z"
          - id: 2
            title: "Call mom"
            description: "Discuss weekend plans"
            completed: false
            created_at: "2026-01-16T11:00:00Z"
            updated_at: "2026-01-16T11:00:00Z"
      - parameters:
          user_id: 123
          status: "pending"
        result:
          - id: 1
            title: "Buy groceries"
            description: null
            completed: false
            created_at: "2026-01-16T10:00:00Z"
            updated_at: "2026-01-16T10:00:00Z"

  - name: complete_task
    description: Mark a task as complete or incomplete
    parameters:
      - name: user_id
        type: integer
        required: true
        description: ID of the user who owns the task
      - name: task_id
        type: integer
        required: true
        description: ID of the task to complete
    returns:
      type: object
      properties:
        task_id:
          type: integer
          description: ID of the completed task
        status:
          type: string
          enum: [pending, completed]
          description: New status of the task
        title:
          type: string
          description: Title of the task
    examples:
      - parameters:
          user_id: 123
          task_id: 456
        result:
          task_id: 456
          status: "completed"
          title: "Buy groceries"

  - name: delete_task
    description: Remove a task permanently
    parameters:
      - name: user_id
        type: integer
        required: true
        description: ID of the user who owns the task
      - name: task_id
        type: integer
        required: true
        description: ID of the task to delete
    returns:
      type: object
      properties:
        task_id:
          type: integer
          description: ID of the deleted task
        status:
          type: string
          enum: [deleted]
          description: Confirmation of deletion
        title:
          type: string
          description: Title of the deleted task
    examples:
      - parameters:
          user_id: 123
          task_id: 456
        result:
          task_id: 456
          status: "deleted"
          title: "Buy groceries"

  - name: update_task
    description: Update task details (title and/or description)
    parameters:
      - name: user_id
        type: integer
        required: true
        description: ID of the user who owns the task
      - name: task_id
        type: integer
        required: true
        description: ID of the task to update
      - name: title
        type: string
        required: false
        description: New title for the task
        min_length: 1
        max_length: 255
      - name: description
        type: string
        required: false
        description: New description for the task
        max_length: 10000
    returns:
      type: object
      properties:
        task_id:
          type: integer
          description: ID of the updated task
        status:
          type: string
          enum: [pending, completed]
          description: Current status of the task
        title:
          type: string
          description: Updated title of the task
    examples:
      - parameters:
          user_id: 123
          task_id: 456
          title: "Buy milk and eggs"
        result:
          task_id: 456
          status: "pending"
          title: "Buy milk and eggs"
      - parameters:
          user_id: 123
          task_id: 456
          description: "Get organic milk and free-range eggs"
        result:
          task_id: 456
          status: "pending"
          title: "Buy groceries"

# Tool Design Principles
design_principles:
  - name: Stateless
    description: |
      All tools are stateless functions. They receive input parameters,
      perform database operations, and return results. No shared state
      or memory between invocations.

  - name: User Isolation
    description: |
      All tools require user_id parameter and enforce user isolation
      at the database query level. Users can only access their own tasks.

  - name: Idempotency
    description: |
      Where possible, tools are idempotent. Calling the same tool with
      the same parameters produces the same result (e.g., completing
      an already completed task is a no-op).

  - name: Error Handling
    description: |
      Tools return structured error responses for invalid inputs,
      missing resources, or permission violations. Errors are logged
      but not exposed to users in detail.

  - name: Database Per Request
    description: |
      Each tool invocation opens a new database connection/session,
      performs its operation, and closes the connection. No connection
      pooling across tool calls.

# Error Codes
error_codes:
  - code: TASK_NOT_FOUND
    description: Task with specified ID does not exist or user lacks access
    http_status: 404

  - code: INVALID_PARAMETERS
    description: Required parameters missing or invalid format
    http_status: 400

  - code: UNAUTHORIZED
    description: User not authenticated or token invalid
    http_status: 401

  - code: FORBIDDEN
    description: User lacks permission to perform operation
    http_status: 403

  - code: DATABASE_ERROR
    description: Database operation failed
    http_status: 500

  - code: INTERNAL_ERROR
    description: Unexpected error during tool execution
    http_status: 500
