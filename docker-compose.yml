# Docker Compose Configuration for Todo App Full Stack
#
# This file orchestrates the frontend, backend, and database services
# for local development and testing.
#
# Usage:
#   docker compose up          # Start all services
#   docker compose down        # Stop all services
#   docker compose up --build  # Rebuild and start
#   docker compose logs -f     # View logs

version: '3.9'

services:
  # Backend API (FastAPI) - Connects directly to Neon PostgreSQL
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.11
    container_name: todo-backend
    restart: unless-stopped
    environment:
      # Database Configuration - Using Neon PostgreSQL directly
      DATABASE_URL: ${DATABASE_URL:-postgresql://neondb_owner:npg_0Oe1uvdXGDAt@ep-super-voice-a42icjpb-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}

      # Authentication Configuration (shared with frontend)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-MySecureRandomString123456789012345678901234567890}

      # CORS Configuration
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000

      # Server Configuration
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: ${RELOAD:-true}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - todo-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=18
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    container_name: todo-frontend
    restart: unless-stopped
    environment:
      # API Configuration
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}

      # Better Auth Configuration
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-MySecureRandomString123456789012345678901234567890}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}

      # Environment
      NODE_ENV: ${NODE_ENV:-development}

      # Next.js Configuration
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - frontend_cache:/app/.next/cache
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - todo-network
    command: npm run dev

# Named volumes for data persistence
volumes:
  backend_cache:
    driver: local
    name: todo_backend_cache
  frontend_cache:
    driver: local
    name: todo_frontend_cache

# Network for service communication
networks:
  todo-network:
    driver: bridge
    name: todo-network
